# Window rules for the price overlay on Hyprland.
#
# Without them the compositor treats the overlay like any other window: it draws a border and a shadow
# round it, animates it, blurs what is behind it and lets it take focus from the game.
#
# Put these in ~/.config/hypr/hyprland.conf.

windowrule = float,    class:^(Poe2StashPricer\.App)$
windowrule = pin,      class:^(Poe2StashPricer\.App)$
windowrule = nofocus,  class:^(Poe2StashPricer\.App)$
windowrule = noborder, class:^(Poe2StashPricer\.App)$
windowrule = noshadow, class:^(Poe2StashPricer\.App)$
windowrule = noblur,   class:^(Poe2StashPricer\.App)$
windowrule = noanim,   class:^(Poe2StashPricer\.App)$

# The game is an XWayland client. With fractional scaling, telling Xwayland not to scale keeps the
# coordinates the app reads off the screen the same as the ones it points the mouse at.
# xwayland {
#     force_zero_scaling = true
# }
